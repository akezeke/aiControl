<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010501" />
    <title>Image · AI Control</title>
    <style>
      html { color-scheme: dark; background: #111; }
      body { margin: 0; font: 16px system-ui, sans-serif; }
      header { position: sticky; top: 0; padding: max(8px, env(safe-area-inset-top)) 12px 8px; background: #181818; }
      button { min-height: 44px; padding: 0 14px; border: 1px solid #777; border-radius: 6px; background: #292929; color: white; font: inherit; cursor: pointer; }
      main { min-height: calc(100dvh - 60px); display: grid; place-items: center; }
      img { display: block; max-width: 100%; height: auto; }
    </style>
  </head>
  <body id="image-window">
    <header><button id="back" type="button">← AI Control</button></header>
    <main><img id="image" alt="Full-size screenshot" /></main>
    <script type="module" src="/image-window.js"></script>
  </body>
</html>
