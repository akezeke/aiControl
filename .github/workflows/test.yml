name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'macOS'
        run: brew install tmux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux iproute2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tests/fixtures/lifecycle.mjs
